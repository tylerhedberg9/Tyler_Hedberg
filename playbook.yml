---
- name: Configure Lab6
  hosts: local
  become: true

  tasks:
    - name: Install asciinema
      ansible.builtin.apt:
        name: asciinema
        state: present

    - name: Install Apache2
      ansible.builtin.apt:
        name: apache2
        state: present
        update_cache: true
        cache_valid_time: 3600

    - name: Start and enable Apache2
      ansible.builtin.service:
        name: apache2
        state: started
        enabled: true

    - name: Show completion message
      ansible.builtin.debug:
        msg: "Lab6 Complete!"
